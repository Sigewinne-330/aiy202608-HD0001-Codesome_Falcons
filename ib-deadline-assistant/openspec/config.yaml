schema: spec-driven

context: |
  Product: a hackathon-oriented long-term task and deadline assistant for students.
  Backend: Python 3.10+, FastAPI, Pydantic 2, SQLAlchemy 2, MySQL/PyMySQL, bcrypt, JWT.
  Frontend: Vue 3, Vite 6, Vue Router, Vuetify; browser API calls use /api via the Vite proxy.
  Architecture: synchronous FastAPI routers and services, SQLAlchemy models, manual SQL bootstrap plus startup table sync.
  Authentication currently uses models.user.User and the users table; the separate AppUser/user table is not authoritative for auth.
  Priorities: demo-ready MVP, focused changes, no unnecessary dependencies, no unrelated refactors, preserve existing behavior.
  Quality gate: backend validation is authoritative; tests and frontend production build must pass before archive.
  Repository instructions: read AGENTS.md and docs/ai-development/competition-checklist.md.

rules:
  proposal:
    - Include Goal, Background, User Story, Requirements, Scope, and Non-goals.
    - Explain user value and why the change is needed now.
    - Prefer a demo-ready MVP and identify deferred work explicitly.
  specs:
    - Every requirement must include at least one Given/When/Then scenario.
    - Include explicit Acceptance Criteria and Edge Cases.
    - Specify observable behavior, including failure and recovery paths.
  design:
    - Include Architecture, Data Model, API Changes, Component Changes, and Technical Decisions.
    - Address security, compatibility, rollout, and external-service failure behavior where relevant.
    - Preserve existing architecture unless the proposal explicitly justifies a change.
  tasks:
    - Organize tasks as focused checkboxes with Dependencies, Priority, and Verification method.
    - Include tests, documentation/spec synchronization, and final verification tasks.
    - Order tasks so the demo-critical path is implemented first.

operations:
  apply:
    guidance:
      - Inspect related files and explain the implementation plan before editing product code.
      - Make minimal changes and update artifacts if implementation decisions change.
      - Mark a task complete only after its verification method succeeds.
  archive:
    guidance:
      - Run focused tests, regression checks, and the frontend production build before archiving.
      - Confirm specs describe the implemented behavior and report remaining risks.
